<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="triangle">
      <path d="M29 8 59 49 5 56Z"/>
    </clipPath>
    <linearGradient
      id="red"
      x1="29"
      y1="8"
      x2="34.72"
      y2="52.15"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#ff0000"/>
      <stop offset="1" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient
      id="green"
      x1="5"
      y1="56"
      x2="43.51"
      y2="27.82"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#00ff00"/>
      <stop offset="1" stop-color="#00ff00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient
      id="blue"
      x1="59"
      y1="49"
      x2="18.6"
      y2="28.8"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#0000ff"/>
      <stop offset="1" stop-color="#0000ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#triangle)">
    <rect width="64" height="64" fill="url(#red)"/>
    <rect
      width="64"
      height="64"
      fill="url(#green)"
      style="mix-blend-mode:screen"
    />
    <rect
      width="64"
      height="64"
      fill="url(#blue)"
      style="mix-blend-mode:screen"
    />
  </g>
</svg>
