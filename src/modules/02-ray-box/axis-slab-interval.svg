<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">One-axis slab interval</title>
  <desc id="desc">A ray crosses two parallel planes. The segment between the two intersection points is the interval where the ray is inside the slab.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#f8fafc"/>
    </marker>
    <style>
      .title { fill:#e2e8f0; font:700 20px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .label { fill:#e2e8f0; font:17px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .small { fill:#94a3b8; font:14px ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect width="960" height="500" rx="18" fill="#0f172a"/>
  <text x="480" y="38" text-anchor="middle" class="title">
    Two plane intersections define one slab interval
  </text>

  <!-- The infinite region between the two planes -->
  <rect x="310" y="82" width="340" height="250" fill="#f87171" fill-opacity=".07"/>

  <!-- Parallel bounding planes -->
  <polygon points="275,105 345,70 345,305 275,340"
           fill="#ef4444" fill-opacity=".22" stroke="#f87171" stroke-width="3"/>
  <polygon points="615,105 685,70 685,305 615,340"
           fill="#ef4444" fill-opacity=".22" stroke="#f87171" stroke-width="3"/>

  <text x="310" y="62" text-anchor="middle" class="label">i = -h plane</text>
  <text x="650" y="62" text-anchor="middle" class="label">i = +h plane</text>
  <text x="480" y="100" text-anchor="middle" class="small">inside the i-axis slab</text>

  <!-- Ray and its two plane intersections -->
  <line x1="75" y1="220" x2="885" y2="220"
        stroke="#f8fafc" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="75" cy="220" r="8" fill="#f8fafc"/>
  <circle cx="310" cy="220" r="11" fill="#fbbf24" stroke="#0f172a" stroke-width="3"/>
  <circle cx="650" cy="220" r="11" fill="#fbbf24" stroke="#0f172a" stroke-width="3"/>

  <text x="75" y="202" text-anchor="middle" class="small">origin o</text>
  <text x="820" y="202" text-anchor="middle" class="small">direction d</text>
  <text x="310" y="252" text-anchor="middle" class="label">t₀,i</text>
  <text x="650" y="252" text-anchor="middle" class="label">t₁,i</text>

  <!-- Project the intersection points onto a separate interval row -->
  <line x1="310" y1="270" x2="310" y2="350" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="650" y1="270" x2="650" y2="350" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="310" y1="350" x2="650" y2="350" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
  <circle cx="310" cy="350" r="10" fill="#fbbf24"/>
  <circle cx="650" cy="350" r="10" fill="#fbbf24"/>

  <text x="480" y="390" text-anchor="middle" class="title">
    slab interval = [t_min,i, t_max,i]
  </text>
  <text x="480" y="425" text-anchor="middle" class="small">
    For the direction shown: t_min,i = t₀,i and t_max,i = t₁,i
  </text>
  <text x="480" y="456" text-anchor="middle" class="small">
    If dᵢ is negative, the two values swap; min() and max() restore their order.
  </text>
</svg>
