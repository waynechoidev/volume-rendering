<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">World position to 3D texture coordinate</title>
  <desc id="desc">A point in a world-space box from negative h to positive h maps to a normalized point in a three-dimensional texture from zero to one.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#f8fafc"/>
    </marker>
    <style>
      .title{fill:#e2e8f0;font:700 20px ui-monospace,monospace}.label{fill:#e2e8f0;font:16px ui-monospace,monospace}.small{fill:#94a3b8;font:14px ui-monospace,monospace}
    </style>
  </defs>
  <rect width="960" height="430" rx="18" fill="#0f172a"/>
  <text x="480" y="38" text-anchor="middle" class="title">world box [-h, h]³ → texture [0, 1]³</text>

  <g fill="#60a5fa" fill-opacity=".1" stroke="#60a5fa" stroke-width="3">
    <path d="M110 145H350V345H110Z"/><path d="M175 95H415V295H175Z"/>
    <path d="M110 145L175 95M350 145L415 95M350 345L415 295M110 345L175 295"/>
  </g>
  <circle cx="275" cy="205" r="10" fill="#fbbf24"/>
  <text x="260" y="380" text-anchor="middle" class="label">world position x</text>
  <text x="95" y="365" class="small">(-h,-h,-h)</text>
  <text x="326" y="82" class="small">(h,h,h)</text>

  <line x1="445" y1="220" x2="545" y2="220" stroke="#f8fafc" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="495" y="190" text-anchor="middle" class="small">x / (2h) + 0.5</text>

  <g fill="#4ade80" fill-opacity=".1" stroke="#4ade80" stroke-width="3">
    <path d="M585 145H825V345H585Z"/><path d="M650 95H890V295H650Z"/>
    <path d="M585 145L650 95M825 145L890 95M825 345L890 295M585 345L650 295"/>
  </g>
  <g stroke="#334155" stroke-width="1">
    <path d="M645 125V325M705 110V310M765 100V300M625 178H855M605 228H835M590 278H815"/>
  </g>
  <circle cx="750" cy="205" r="10" fill="#fbbf24"/>
  <text x="735" y="380" text-anchor="middle" class="label">texture coordinate u</text>
  <text x="570" y="365" class="small">(0,0,0)</text>
  <text x="815" y="82" class="small">(1,1,1)</text>
</svg>
