<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Camera ray reconstruction</title>
  <desc id="desc">A screen UV coordinate is mapped to NDC, unprojected to a far-plane world point, and connected to the camera to form a ray.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#f8fafc"/>
    </marker>
    <style>
      .title{fill:#e2e8f0;font:700 20px ui-monospace,monospace}.label{fill:#e2e8f0;font:16px ui-monospace,monospace}.small{fill:#94a3b8;font:14px ui-monospace,monospace}
    </style>
  </defs>
  <rect width="960" height="430" rx="18" fill="#0f172a"/>
  <text x="480" y="38" text-anchor="middle" class="title">UV → NDC → world-space camera ray</text>

  <rect x="65" y="105" width="190" height="190" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="3"/>
  <circle cx="195" cy="165" r="8" fill="#fbbf24"/>
  <text x="160" y="325" text-anchor="middle" class="label">screen UV</text>
  <text x="195" y="148" text-anchor="middle" class="small">(u, v)</text>
  <text x="78" y="285" class="small">(0, 0)</text>
  <text x="209" y="125" class="small">(1, 1)</text>

  <line x1="280" y1="200" x2="365" y2="200" stroke="#f8fafc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="322" y="184" text-anchor="middle" class="small">2u - 1</text>

  <rect x="390" y="105" width="190" height="190" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
  <line x1="485" y1="115" x2="485" y2="285" stroke="#64748b"/>
  <line x1="400" y1="200" x2="570" y2="200" stroke="#64748b"/>
  <circle cx="520" cy="165" r="8" fill="#fbbf24"/>
  <text x="485" y="325" text-anchor="middle" class="label">NDC</text>
  <text x="520" y="148" text-anchor="middle" class="small">(x, y, z=1)</text>
  <text x="401" y="285" class="small">(-1, -1)</text>
  <text x="515" y="125" class="small">(1, 1)</text>

  <line x1="605" y1="200" x2="680" y2="200" stroke="#f8fafc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="642" y="174" text-anchor="middle" class="small">(VP)⁻¹</text>
  <text x="642" y="191" text-anchor="middle" class="small">divide by w</text>

  <polygon points="740,95 885,135 885,300 740,340" fill="#22c55e" fill-opacity=".12" stroke="#4ade80" stroke-width="3"/>
  <circle cx="785" cy="215" r="8" fill="#fbbf24"/>
  <circle cx="670" cy="275" r="9" fill="#f8fafc"/>
  <line x1="670" y1="275" x2="785" y2="215" stroke="#f8fafc" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="800" y="202" class="small">far_world</text>
  <text x="640" y="305" class="small">camera o</text>
  <text x="777" y="370" text-anchor="middle" class="label">ray direction d</text>
</svg>
