<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Discrete ray marching and compositing</title>
  <desc id="desc">A ray interval is split into segments, sampled at each midpoint, and accumulated from front to back.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#f8fafc"/>
    </marker>
    <style>
      .title{fill:#e2e8f0;font:700 20px ui-monospace,monospace}.label{fill:#e2e8f0;font:16px ui-monospace,monospace}.small{fill:#94a3b8;font:14px ui-monospace,monospace}
    </style>
  </defs>
  <rect width="960" height="440" rx="18" fill="#0f172a"/>
  <text x="480" y="38" text-anchor="middle" class="title">Split → midpoint sample → front-to-back accumulate</text>

  <line x1="90" y1="165" x2="870" y2="165" stroke="#f8fafc" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="190" y="105" width="600" height="120" rx="8" fill="#60a5fa" fill-opacity=".1" stroke="#60a5fa" stroke-width="2"/>

  <g stroke="#64748b" stroke-width="2">
    <line x1="190" y1="105" x2="190" y2="225"/><line x1="290" y1="105" x2="290" y2="225"/>
    <line x1="390" y1="105" x2="390" y2="225"/><line x1="490" y1="105" x2="490" y2="225"/>
    <line x1="590" y1="105" x2="590" y2="225"/><line x1="690" y1="105" x2="690" y2="225"/>
    <line x1="790" y1="105" x2="790" y2="225"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="240" cy="165" r="9"/><circle cx="340" cy="165" r="9"/>
    <circle cx="440" cy="165" r="9"/><circle cx="540" cy="165" r="9"/>
    <circle cx="640" cy="165" r="9"/><circle cx="740" cy="165" r="9"/>
  </g>

  <text x="190" y="252" text-anchor="middle" class="small">t_near</text>
  <text x="790" y="252" text-anchor="middle" class="small">t_far</text>
  <text x="240" y="95" text-anchor="middle" class="small">midpoint</text>
  <path d="M190 278H290" stroke="#4ade80" stroke-width="4"/>
  <text x="240" y="301" text-anchor="middle" class="small">segment length δ</text>

  <g class="label">
    <text x="180" y="350">sample 1</text><text x="335" y="350">sample 2</text>
    <text x="490" y="350">sample 3</text><text x="645" y="350">…</text>
  </g>
  <g stroke="#f8fafc" stroke-width="3" marker-end="url(#arrow)">
    <line x1="265" y1="344" x2="320" y2="344"/>
    <line x1="420" y1="344" x2="475" y2="344"/>
    <line x1="575" y1="344" x2="630" y2="344"/>
  </g>
  <text x="480" y="405" text-anchor="middle" class="small">
    radiance += Tᵢ αᵢ cᵢ, then Tᵢ₊₁ = Tᵢ(1 - αᵢ)
  </text>
</svg>
